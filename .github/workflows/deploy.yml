name: Build & Deploy Frontend (Local Machine)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted   # IMPORTANT: Your Mac will run this job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Change this path to where your local app should be deployed
      - name: Copy dist to local deployment folder
        run: |
          rm -rf /Users/sudheer/hospital-frontend-dist
          mkdir -p /Users/sudheer/hospital-frontend-dist
          cp -r dist/* /Users/sudheer/hospital-frontend-dist/
